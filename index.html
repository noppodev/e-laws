<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>e-Laws｜法令検索</title><style>
:root{--ink:#18212f;--muted:#64748b;--line:#dbe2ea;--paper:#f5f7fa;--brand:#123b6d;--accent:#1769aa}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}header{background:var(--brand);color:#fff;padding:18px 24px}header .bar{max-width:1180px;margin:auto;display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:800;letter-spacing:.02em}.sub{font-size:12px;opacity:.8}main{max-width:1180px;margin:0 auto;padding:36px 20px}.hero{background:#fff;border:1px solid var(--line);padding:34px;border-radius:12px;box-shadow:0 4px 18px #13233d0b}.hero h1{margin:0 0 8px;font-size:30px}.search{display:flex;margin-top:24px}.search input{flex:1;padding:15px 17px;border:1px solid #b9c5d3;border-radius:8px 0 0 8px;font-size:16px}.search button{border:0;background:var(--accent);color:#fff;padding:0 25px;border-radius:0 8px 8px 0;font-weight:700}.meta{color:var(--muted);font-size:13px;margin-top:12px}.list{margin-top:26px;display:grid;gap:10px}.law{background:#fff;border:1px solid var(--line);padding:19px 21px;border-radius:9px;cursor:pointer}.law:hover{border-color:#8ba8c5;box-shadow:0 3px 10px #13233d10}.law strong{font-size:17px}.law small{display:block;color:var(--muted);margin-top:6px}#detail{display:none}.crumb{color:var(--muted);font-size:13px;margin-bottom:18px}.paper{background:#fff;border:1px solid var(--line);padding:45px;max-width:900px;margin:auto}.paper h1{text-align:center;font-size:28px;margin:0 0 12px}.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:25px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px}.actions a,.actions button{padding:9px 13px;border:1px solid #b9c5d3;background:#fff;color:var(--ink);border-radius:6px;text-decoration:none;cursor:pointer}.actions .primary{background:var(--accent);color:#fff;border-color:var(--accent)}.toc{background:#f7f9fb;border:1px solid var(--line);padding:16px;margin:20px 0}.toc a{display:block;color:var(--accent);padding:4px;text-decoration:none}.chapter{margin-top:34px}.chapter h2{text-align:center;font-size:20px;border-bottom:2px solid var(--ink);padding-bottom:8px}.article{margin:22px 0;line-height:1.9}.article h3{font-size:16px;margin:0 0 5px}.article p{margin:5px 0 0;padding-left:1.7em}.empty{padding:35px;text-align:center;color:var(--muted)}@media(max-width:650px){main{padding:18px 12px}.hero,.paper{padding:22px}.search button{padding:0 16px}.paper h1{font-size:23px}}
@media print{header,.crumb,.actions,.toc,#home,.no-print{display:none!important}body{background:#fff}.paper{border:0;max-width:none;padding:0}.chapter h2{break-after:avoid}.article{break-inside:avoid}}
</style></head><body><header><div class="bar"><div><div class="logo">e-Laws</div><div class="sub">法令検索・法令情報提供システム</div></div><div class="sub">Laws & Regulations</div></div></header><main><section id="home"><div class="hero"><h1>法令を検索</h1><div class="search"><input id="q" placeholder="法令名・条文・キーワードを入力"><button id="search">検索</button></div><div id="count" class="meta">法令データを読み込んでいます…</div></div><div id="results" class="list"></div></section><section id="detail"><div class="crumb"><a href="#" id="back">e-Laws</a> / 法令詳細</div><article class="paper"><h1 id="title"></h1><div class="actions"><a id="xml" class="primary" download>XMLをダウンロード</a><a id="pdf" download>PDFをダウンロード</a><button onclick="window.print()">印刷 / PDF</button></div><div id="toc" class="toc"></div><div id="body"></div></article></section></main><script>
let index=[];let docs=[];const $=s=>document.querySelector(s);async function init(){try{index=await fetch('laws/index.json?'+Date.now()).then(r=>r.json());$('#count').textContent=`登録法令 ${index.length}件`;render(index)}catch(e){$('#count').textContent='法令一覧を読み込めませんでした。'}}function render(items){const q=$('#q').value.trim().toLowerCase();const filtered=items.filter(x=>!q||x.title.toLowerCase().includes(q));$('#results').innerHTML=filtered.length?filtered.map(x=>`<div class="law" data-id="${x.id}"><strong>${esc(x.title)}</strong><small>${esc(x.file)}</small></div>`).join(''):'<div class="empty">該当する法令がありません。</div>';document.querySelectorAll('.law').forEach(el=>el.onclick=()=>openLaw(el.dataset.id))}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function openLaw(id){const x=index.find(a=>a.id===id);if(!x)return;const xml=await fetch('laws/'+encodeURIComponent(x.file)).then(r=>r.text());const p=new DOMParser().parseFromString(xml,'application/xml');$('#title').textContent=x.title;$('#xml').href='laws/'+encodeURIComponent(x.file);$('#pdf').href='laws/'+encodeURIComponent(x.pdf);const pre=p.querySelector('Preamble');const chapters=[...p.querySelectorAll(':scope > Chapter')];let html='';if(pre)html+=`<div class="article"><h3>前文</h3><p>${esc(pre.textContent.trim())}</p></div>`;const toc=[];chapters.forEach(ch=>{const n=ch.getAttribute('Num')||'';const t=ch.querySelector(':scope > ChapterTitle')?.textContent.trim()||'';html+=`<section class="chapter"><h2>第${esc(n)}章　${esc(t)}</h2>`;[...ch.querySelectorAll(':scope > Article')].forEach(a=>{const an=a.getAttribute('Num')||'';const paras=[...a.querySelectorAll(':scope > Sentence, :scope > Paragraph')].map(n=>n.textContent.trim()).filter(Boolean);const id='article-'+an;toc.push([id,`第${an}条`]);html+=`<div class="article" id="${id}"><h3>第${esc(an)}条</h3>${paras.map(v=>`<p>${esc(v)}</p>`).join('')}</div>`});html+='</section>'});if(!chapters.length){[...p.querySelectorAll('Article')].forEach(a=>{const an=a.getAttribute('Num')||'';const id='article-'+an;toc.push([id,`第${an}条`]);html+=`<div class="article" id="${id}"><h3>第${esc(an)}条</h3><p>${esc(a.textContent.trim())}</p></div>`})}$('#toc').innerHTML=toc.length?'<strong>条文目次</strong>'+toc.map(t=>`<a href="#${t[0]}">${t[1]}</a>`).join(''):'';$('#body').innerHTML=html;$('#home').style.display='none';$('#detail').style.display='block';history.pushState({},'',`#${encodeURIComponent(id)}`)}$('#back').onclick=e=>{e.preventDefault();$('#detail').style.display='none';$('#home').style.display='block';history.pushState({},'',location.pathname)};$('#search').onclick=()=>render(index);$('#q').onkeydown=e=>{if(e.key==='Enter')render(index)};window.onpopstate=()=>{location.hash?openLaw(decodeURIComponent(location.hash.slice(1))):$('#back').click()};init();if(location.hash)openLaw(decodeURIComponent(location.hash.slice(1)));
</script></body></html>
