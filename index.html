<html lang="ja">
<head>
<meta charset="UTF-8">

<meta

<style>
/* =========================================================
   e-Laws Design System
   ========================================================= */

:root {
  --navy: #0b1f3a;
  --navy-2: #102b4e;
  --blue: #155eef;
  --blue-dark: #0f4ac4;

  --ink: #182230;
  --muted: #667085;

  --paper: #f5f7fa;
  --surface: #ffffff;
  --surface-2: #f8fafc;

  --line: #d9dee7;
  --line-dark: #c5ccd8;

  --success: #16794c;
  --danger: #b42318;

  --shadow-sm:
    0 1px 2px rgba(16, 24, 40, .04);

  --shadow-md:
    0 6px 20px rgba(16, 24, 40, .07);

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;

  --container: 1180px;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  color: var(--ink);
  background: var(--paper);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;

  line-height: 1.75;
}

/* =========================================================
   Header
   ========================================================= */

.site-header {
  background: var(--navy);
  color: #fff;
}

.header-government {
  border-bottom: 1px solid rgba(255,255,255,.12);
}

.header-government-inner {
  max-width: var(--container);
  margin: auto;
  min-height: 38px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 24px;

  font-size: 12px;
}

.header-main {
  max-width: var(--container);
  margin: auto;

  min-height: 78px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 24px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 14px;

  color: white;
  text-decoration: none;
}

.brand-mark {
  width: 42px;
  height: 42px;

  display: grid;
  place-items: center;

  background: white;
  color: var(--navy);

  border-radius: 50%;

  font-weight: 900;
  letter-spacing: -1px;
}

.brand-name {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -.02em;
}

.brand-subtitle {
  font-size: 11px;
  opacity: .72;
  margin-top: -3px;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.header-button {
  border: 1px solid rgba(255,255,255,.2);
  background: transparent;
  color: white;

  padding: 8px 13px;
  border-radius: 6px;

  cursor: pointer;
}

.header-button:hover {
  background: rgba(255,255,255,.1);
}

/* =========================================================
   Navigation
   ========================================================= */

.main-nav {
  background: white;
  border-bottom: 1px solid var(--line);
}

.main-nav-inner {
  max-width: var(--container);
  margin: auto;

  padding: 0 24px;

  display: flex;
  align-items: center;
  gap: 4px;
}

.nav-link {
  display: inline-flex;
  align-items: center;

  min-height: 48px;
  padding: 0 15px;

  color: #344054;
  text-decoration: none;

  font-size: 14px;
  font-weight: 600;

  border-bottom: 3px solid transparent;
}

.nav-link:hover {
  background: var(--surface-2);
}

.nav-link.active {
  color: var(--blue);
  border-bottom-color: var(--blue);
}

/* =========================================================
   Main
   ========================================================= */

main {
  min-height: calc(100vh - 200px);
}

.container {
  max-width: var(--container);
  margin: auto;
  padding: 0 24px;
}

/* =========================================================
   Hero / Search
   ========================================================= */

.search-section {
  background:
    linear-gradient(
      180deg,
      #edf3fb 0%,
      #f5f7fa 100%
    );

  border-bottom: 1px solid var(--line);
}

.search-inner {
  padding: 52px 24px 48px;
}

.eyebrow {
  color: var(--blue);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: .08em;
  margin-bottom: 8px;
}

.search-title {
  margin: 0;

  font-size: clamp(28px, 4vw, 40px);
  line-height: 1.3;

  letter-spacing: -.035em;
}

.search-description {
  margin: 12px 0 28px;

  color: var(--muted);

}

.search-box {
  display: flex;

  max-width: 820px;

  background: white;

  border: 1px solid var(--line-dark);
  border-radius: 9px;

  box-shadow: var(--shadow-md);

  overflow: hidden;
}

.search-icon {
  width: 54px;

  display: grid;
  place-items: center;

  color: var(--muted);
}

.search-input {
  flex: 1;

  min-width: 0;

  border: 0;
  outline: 0;

  padding: 17px 8px;

  font-size: 16px;

  color: var(--ink);
}

.search-button {
  border: 0;

  background: var(--blue);
  color: white;

  padding: 0 25px;

  font-weight: 700;

  cursor: pointer;
}

.search-button:hover {
  background: var(--blue-dark);
}

.search-hint {
  margin-top: 11px;

  font-size: 12px;

}

/* =========================================================
   Breadcrumb
   ========================================================= */

.breadcrumb {
  max-width: var(--container);
  margin: auto;

  padding: 18px 24px 8px;

}

.breadcrumb a {

  text-decoration: none;
}

.breadcrumb span {
  margin: 0 7px;
}

/* =========================================================
   Content layout
   ========================================================= */

.content-grid {
  display: grid;
  grid-template-columns: 250px minmax(0, 1fr);
  gap: 30px;

  padding-top: 18px;
  padding-bottom: 60px;
}

.sidebar {
  position: sticky;
  top: 18px;
  align-self: start;
}

.sidebar-card {
  background: white;

  border: 1px solid var(--line);
  border-radius: var(--radius-md);

  overflow: hidden;
}

.sidebar-title {
  padding: 15px 17px;

  border-bottom: 1px solid var(--line);

  font-size: 13px;
  font-weight: 800;
}

.sidebar-item {
  display: block;

  padding: 10px 17px;

  color: #475467;
  text-decoration: none;

  font-size: 13px;

}

.sidebar-item:hover {
  background: var(--surface-2);
}

.sidebar-item.active {

  color: var(--blue);

/* =========================================================

   ========================================================= */

.card {

  border: 1px solid var(--line);
  border-radius: var(--radius-md);

/* =========================================================
   Law list
   ========================================================= */

.page-heading {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;

  gap: 20px;

  margin-bottom: 18px;

.page-heading h1 {

  line-height: 1.4;
}

.result-count {
  color: var(--muted);

}

.law-list {

  gap: 10px;

  display: block;

  padding: 20px 22px;

  color: inherit;
  text-decoration: none;

  transform: translateY(-1px);

.law-item-title {
  margin: 0 0 7px;

  font-size: 17px;

  color: var(--navy);
}

.law-item-meta {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;

  font-size: 12px;
  color: var(--muted);
}

.badge {
  display: inline-flex;
  align-items: center;

  padding: 2px 8px;

  border-radius: 999px;

  background: #eef4ff;
  color: var(--blue);

  font-size: 11px;
  font-weight: 700;
}

/* =========================================================
   Law detail
   ========================================================= */

.law-header {
  padding: 30px;

  border-bottom: 1px solid var(--line);
}

.law-header h1 {
  margin: 0 0 14px;

  font-size: 30px;
  line-height: 1.4;

  letter-spacing: -.02em;
}

.law-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 18px;

  color: var(--muted);

  font-size: 13px;

.action-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;

  padding: 16px 20px;

  background: var(--surface-2);

.action-button {
  display: inline-flex;
  align-items: center;
  gap: 7px;

  min-height: 38px;

  padding: 0 13px;

  border: 1px solid var(--line-dark);
  border-radius: 6px;

  background: white;
  color: #344054;

  text-decoration: none;

  font-size: 13px;
  font-weight: 650;

  cursor: pointer;
}

.action-button:hover {
  background: #f2f4f7;
}

.action-button.primary {
  background: var(--blue);
  border-color: var(--blue);
  color: white;
}

.action-button.primary:hover {

}

/* =========================================================
   Preamble
   ========================================================= */

.preamble {

  border-bottom: 1px solid var(--line);
}

.section-label {
  margin-bottom: 13px;

  color: var(--blue);

  font-weight: 800;

  letter-spacing: .08em;
}

.preamble-text {

  font-size: 15px;

/* =========================================================
   Chapter
   ========================================================= */

.chapter {
  border-bottom: 1px solid var(--line);
}

.chapter:last-child {
  border-bottom: 0;
}

.chapter-heading {
  padding: 22px 30px;

  background:
    linear-gradient(

      #f4f7fb,
      #fff

}

.chapter-number {
  display: block;

  margin-bottom: 3px;

  color: var(--blue);

  font-size: 11px;
  font-weight: 800;

  letter-spacing: .08em;
}

.chapter-title {
  margin: 0;

  font-size: 20px;
}

/* =========================================================
   Article
   ========================================================= */

.article {
  padding: 27px 30px;

  scroll-margin-top: 25px;
}

.article + .article {
  border-top: 1px dashed var(--line);
}

.article-number {
  display: inline-block;

  min-width: 58px;

  color: var(--navy);

  font-size: 15px;
  font-weight: 850;
}

.article-body {
  display: inline;

  font-size: 15px;
  line-height: 2.05;
}

.article-sentence {
  margin: 0 0 9px;
}

.article-sentence:last-child {

}

/* =========================================================
   Search highlight
   ========================================================= */

mark {
  background: #fff0a8;
  color: inherit;

  padding: 0 2px;

  border-radius: 2px;
}

/* =========================================================
   Loading / empty / error
   ========================================================= */

.state {
  padding: 70px 30px;

  text-align: center;
  color: var(--muted);
}

.spinner {
  width: 28px;
  height: 28px;

  margin: 0 auto 15px;

  border: 3px solid #dce3ed;
  border-top-color: var(--blue);

  border-radius: 50%;

  animation: spin .7s linear infinite;
}

@keyframes spin {

.error-box {
  padding: 20px;

  background: #fff5f4;

  border: 1px solid #f1b8b3;

  border-radius: var(--radius-md);

/* =========================================================
   Footer

.site-footer {

  color: rgba(255,255,255,.72);

.footer-inner {
  max-width: var(--container);
  margin: auto;

  padding: 35px 24px;
}

.footer-title {
  color: white;

  font-weight: 800;

  margin-bottom: 6px;
}

.footer-note {
  font-size: 12px;
}

/* =========================================================
   Dark mode
   ========================================================= */

@media (prefers-color-scheme: dark) {

  body {
    --ink: #e7edf5;
    --muted: #9aa8ba;

    --paper: #0d141d;
    --surface: #111a25;

    --line: #263445;
    --line-dark: #34455a;

    --navy: #081321;

/* =========================================================
   Mobile
   ========================================================= */

@media (max-width: 800px) {

  .breadcrumb {

  }

  .sidebar {

  .sidebar-card {

  .law-header {

  }

  .law-header h1 {

  .preamble {

/* =========================================================
   Print
   ========================================================= */

@media print {

  body {

    color: black;
  }

  .main-nav,
  .search-section,
  .breadcrumb,

  }

<main id="app"></main>

    </div>

    </div>

    </div>

<script>
/* =========================================================
   e-Laws Application
   ========================================================= */

const state = {
  laws: [],
  currentLaw: null,
  searchQuery: ""
};

const app = document.getElementById("app");

/* =========================================================
   Utility
   ========================================================= */

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function highlight(text, query) {

  const escaped = escapeHtml(text);

  if (!query) return escaped;

  const words = query
    .trim()
    .split(/\s+/)
    .filter(Boolean);

  let result = escaped;

  for (const word of words) {

    const escapedWord =
      escapeHtml(word);

    if (!escapedWord) continue;

    const regex =
      new RegExp(
        `(${escapedWord.replace(
          /[.*+?^${}()|[\]\\]/g,
          "\\$&"
        )})`,
        "gi"
      );

    result = result.replace(
      regex,
      "<mark>$1</mark>"
    );
  }

  return result;
}

/* =========================================================
   Loading
   ========================================================= */

function showLoading() {

  app.innerHTML = `
    <div class="state">
      <div class="spinner"></div>
      <div>法令データを読み込んでいます…</div>
    </div>
  `;
}

/* =========================================================
   Error
   ========================================================= */

function showError(message) {

  app.innerHTML = `
    <div class="container" style="padding-top:40px;">
      <div class="error-box">
        <strong>データを読み込めませんでした</strong>
        <div style="margin-top:6px;">
          ${escapeHtml(message)}
        </div>
      </div>
    </div>
  `;
}

/* =========================================================
   XML parser
   ========================================================= */

function parseXml(xmlText) {

  const parser =
    new DOMParser();

  const xml =
    parser.parseFromString(
      xmlText,
      "application/xml"
    );

  const title =
    xml.querySelector("Title")
      ?.textContent
      ?.trim() || "";

  const preamble =
    xml.querySelector("Preamble")
      ?.textContent
      ?.trim() || "";

  const chapters = [];

  xml.querySelectorAll(":scope > Chapter")
    .forEach(chapter => {

      const num =
        chapter.getAttribute("Num") || "";

      const title =
        chapter.querySelector(":scope > ChapterTitle")
          ?.textContent
          ?.trim() || "";

      const articles = [];

      chapter.querySelectorAll(":scope > Article")
        .forEach(article => {

          const articleNum =
            article.getAttribute("Num") || "";

          const sentences =
            [...article.querySelectorAll(
              ":scope > Sentence"
            )]
            .map(
              el => el.textContent.trim()
            )
            .filter(Boolean);

          articles.push({
            num: articleNum,
            sentences
          });

        });

      chapters.push({
        num,
        title,
        articles
      });

    });

  return {
    title,
    preamble,
    chapters
  };
}

/* =========================================================
   Load index
   ========================================================= */

async function loadIndex() {

  showLoading();

  try {

    const response =
      await fetch("laws/index.json", {
        cache: "no-store"
      });

    if (!response.ok) {
      throw new Error(
        `HTTP ${response.status}`
      );
    }

    state.laws =
      await response.json();

    route();

  } catch (error) {

    showError(
      "laws/index.json を読み込めません。"
    );

    console.error(error);
  }
}

/* =========================================================
   Load law
   ========================================================= */

async function loadLaw(id) {

  const item =
    state.laws.find(
      law => law.id === id
    );

  if (!item) {
    renderNotFound();
    return;
  }

  showLoading();

  try {

    const response =
      await fetch(
        `laws/${encodeURIComponent(item.filename)}`,
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {
      throw new Error(
        `HTTP ${response.status}`
      );
    }

    const xml =
      await response.text();

    state.currentLaw = {
      ...item,
      ...parseXml(xml)
    };

    renderLaw();

  } catch (error) {

    showError(
      `${item.title} のXMLを読み込めません。`
    );

    console.error(error);
  }
}

/* =========================================================
   Home
   ========================================================= */

function renderHome(query = "") {

  state.searchQuery = query;

  const filtered =
    state.laws.filter(law => {

      if (!query.trim()) {
        return true;
      }

      return law.title
        .toLowerCase()
        .includes(
          query.toLowerCase()
        );

    });

  app.innerHTML = `

    <section class="search-section">

      <div class="container search-inner">

        <div class="eyebrow">
          ELECTRONIC LAWS DATABASE
        </div>

        <h1 class="search-title">
          法令を検索する
        </h1>

        <p class="search-description">
          法令名やキーワードから、登録されている法令を検索できます。
        </p>

        <form
          class="search-box"
          onsubmit="submitSearch(event)"
        >

          <div class="search-icon">
            🔎
          </div>

          <input
            id="searchInput"
            class="search-input"
            type="search"
            value="${escapeHtml(query)}"
            placeholder="法令名・キーワードを入力"
            autocomplete="off"
          >

          <button
            class="search-button"
            type="submit"
          >
            検索
          </button>

        </form>

        <div class="search-hint">
          例：憲法、大統領、議会、権利
        </div>

      </div>

    </section>

    <div class="container">

      <div class="content-grid">

        <aside class="sidebar">

          <div class="sidebar-card">

            <div class="sidebar-title">
              法令データベース
            </div>

            <a
              class="sidebar-item active"
              href="#/"
            >
              法令検索
            </a>

            <a
              class="sidebar-item"
              href="#/laws"
            >
              法令一覧
            </a>

          </div>

        </aside>

        <section>

          <div class="page-heading">

            <div>
              <h1>
                ${query
                  ? "検索結果"
                  : "法令一覧"}
              </h1>

              <div class="result-count">
                ${filtered.length}件
              </div>
            </div>

          </div>

          ${
            filtered.length
              ? `
                <div class="law-list">

                  ${filtered.map(law => `

                    <a
                      class="card law-item"
                      href="#/law/${encodeURIComponent(law.id)}"
                    >

                      <h2 class="law-item-title">
                        ${highlight(
                          law.title,
                          query
                        )}
                      </h2>

                      <div class="law-item-meta">

                        <span class="badge">
                          法令
                        </span>

                        <span>
                          ${law.articleCount || 0}条
                        </span>

                      </div>

                    </a>

                  `).join("")}

                </div>
              `
              : `
                <div class="card">
                  <div class="state">
                    該当する法令がありません。
                  </div>
                </div>
              `
          }

        </section>

      </div>

    </div>
  `;
}

/* =========================================================
   Laws page
   ========================================================= */

function renderLaws() {
  renderHome("");
}

/* =========================================================
   Law detail
   ========================================================= */

      </div>

            <button

          </div>

          ${
            law.preamble
              ? `
                <section class="preamble">

                  <div class="section-label">

                  </div>

                  <div class="preamble-text">

              `

          }

          ${law.chapters.map(chapter => `

                </span>

                <h2 class="chapter-title">
                  第${escapeHtml(chapter.num)}章
                  ${escapeHtml(chapter.title)}
                </h2>

              </header>

              ${chapter.articles.map(article => `

                <article
                  class="article"
                  id="article-${escapeHtml(chapter.num)}-${escapeHtml(article.num)}"
                >

                  <div>
                    <span class="article-number">
                      第${escapeHtml(article.num)}条
                    </span>

                    <div class="article-body">

                      ${article.sentences.map(sentence => `
                        <p class="article-sentence">
                          ${escapeHtml(sentence)}

                      `).join("")}

  `;

/* =========================================================
   Search
   ========================================================= */

function submitSearch(event) {

  event.preventDefault();

  const input =
    document.getElementById(
      "searchInput"
    );

  const query =
    input?.value.trim() || "";

  renderHome(query);
}

/* =========================================================
   Article count
   ========================================================= */

function countArticles(law) {

  return law.chapters.reduce(
    (sum, chapter) =>
      sum + chapter.articles.length,
    0
  );
}

/* =========================================================
   404
   ========================================================= */

function renderNotFound() {

  app.innerHTML = `

    <div class="container">

      <div class="card">

        <div class="state">

          <div style="
            font-size:48px;
            font-weight:800;
            color:#0b1f3a;
          ">
            404
          </div>

          <div>
            指定された法令が見つかりません。
          </div>

          <div style="margin-top:20px;">
            <a
              class="action-button primary"
              href="#/"
            >
              法令検索へ戻る
            </a>
          </div>

        </div>

      </div>

    </div>
  `;
}

/* =========================================================
   Routing
   ========================================================= */

function route() {

  const hash =
    location.hash || "#/";

  if (hash === "#/" || hash === "#") {
    renderHome();
    return;
  }

  if (hash === "#/laws") {
    renderLaws();
    return;
  }

  const lawMatch =
    hash.match(
      /^#\/law\/([^/]+)/
    );

  if (lawMatch) {

    const id =
      decodeURIComponent(
        lawMatch[1]
      );

    loadLaw(id);
    return;
  }

  renderNotFound();
}

/* =========================================================
   Scroll to article
   ========================================================= */

function scrollToRequestedArticle() {

  const hash =
    location.hash;

  const match =
    hash.match(
      /article-([^#]+)/
    );

  if (!match) return;

  const element =
    document.getElementById(
      `article-${match[1]}`
    );

  if (element) {
    setTimeout(() => {
      element.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }, 100);
  }
}

/* =========================================================
   Dark mode
   ========================================================= */

function toggleDarkMode() {

  const current =
    document.documentElement
      .getAttribute("data-theme");

  document.documentElement
    .setAttribute(
      "data-theme",
      current === "dark"
        ? "light"
        : "dark"
    );
}

/* =========================================================
   Keyboard shortcut
   ========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "/" &&
      document.activeElement.tagName !== "INPUT"
    ) {

      event.preventDefault();

      const input =
        document.getElementById(
          "searchInput"
        );

      input?.focus();
    }

  }
);

/* =========================================================
   Start
   ========================================================= */

window.addEventListener(
  "hashchange",
  route
);

loadIndex();
</script>
