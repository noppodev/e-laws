/* =========================================================
   e-Laws Local Design System

<script>
"use strict";

/* =========================================================
   e-Laws Application
   XML = Source of Truth
   ========================================================= */

const state = {
  laws: [],
  currentLaw: null,
  xmlDocument: null
};

const app = document.getElementById("app");
const breadcrumb = document.getElementById("breadcrumb");

/* ---------------------------------------------------------
   Utilities
--------------------------------------------------------- */

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function getText(node) {
  return node ? node.textContent.trim() : "";
}

function normalizeText(text) {
  return String(text || "")
    .toLowerCase()
    .replace(/\s+/g, "");
}

function setBreadcrumb(items) {
  breadcrumb.innerHTML = items.map((item, index) => {
    if (index === items.length - 1) {
      return `<li aria-current="page">${escapeHtml(item.label)}</li>`;
    }

    return `<li><a href="${escapeHtml(item.href)}">${escapeHtml(item.label)}</a></li>`;
  }).join("");
}

function setActiveNav(name) {
  document.querySelectorAll("[data-nav]").forEach(link => {
    if (link.dataset.nav === name) {
      link.setAttribute("aria-current", "page");
    } else {
      link.removeAttribute("aria-current");
    }
  });
}

function showError(message) {
  app.innerHTML = `
    <div class="status status-error" role="alert">
      <strong>ページを表示できません。</strong>
      <p>${escapeHtml(message)}</p>
    </div>
  `;
}

/* ---------------------------------------------------------
   XML parser
--------------------------------------------------------- */

function parseLawXml(xmlText) {
  const parser = new DOMParser();
  const xml = parser.parseFromString(xmlText, "application/xml");

  if (xml.querySelector("parsererror")) {
    throw new Error("XMLファイルを正しく読み込めませんでした。");
  }

  const root = xml.documentElement;
  const title = getText(root.querySelector(":scope > Title"));
  const preamble = getText(root.querySelector(":scope > Preamble"));

  // XMLの構造を保持し、Sentenceだけに依存しない。
  function parseNode(node) {
    return {
      tag: node.tagName,
      num: node.getAttribute("Num") || "",
      label: node.getAttribute("Label") || "",
      text: getText(node),
      children: [...node.children].map(parseNode)
    };
  }

  const chapters = [...root.querySelectorAll(":scope > Chapter")].map(chapter => ({
    num: chapter.getAttribute("Num") || "",
    title: getText(chapter.querySelector(":scope > ChapterTitle")),
    articles: [...chapter.querySelectorAll(":scope > Article")].map(article => ({
      num: article.getAttribute("Num") || "",
      label: article.getAttribute("Label") || "",
      nodes: [...article.children]
        .filter(node => node.tagName !== "ChapterTitle")
        .map(parseNode)
    }))
  }));

  return { title, preamble, chapters };
}

/* ---------------------------------------------------------
   Load index
--------------------------------------------------------- */

async function loadIndex() {
  const response = await fetch("laws/index.json", {
    cache: "no-store"
  });

  if (!response.ok) {
    throw new Error("法令一覧を取得できませんでした。");
  }

  state.laws = await response.json();
}

/* ---------------------------------------------------------
   Load individual law
--------------------------------------------------------- */

async function loadLaw(id) {
  const law = state.laws.find(item => item.id === id);

  if (!law) {
    throw new Error("指定された法令が見つかりません。");
  }

  const response = await fetch(
    `laws/${encodeURIComponent(law.filename)}`,
    { cache: "no-store" }
  );

  if (!response.ok) {
    throw new Error("法令XMLを取得できませんでした。");
  }

  const xmlText = await response.text();

  const parsed = parseLawXml(xmlText);

  state.currentLaw = {
    ...law,
    ...parsed
  };

  return state.currentLaw;
}

/* ---------------------------------------------------------
   Home
--------------------------------------------------------- */

function renderHome() {
  setActiveNav("home");

  setBreadcrumb([
    { label: "ホーム", href: "#/" }
  ]);

  app.innerHTML = `
    <section class="page-heading">
      <h1>法令情報提供システム</h1>
      <p>
        e-Lawsは、法令を検索し、その本文を閲覧するための情報提供サービスです。
      </p>
    </section>

    <section class="section" aria-labelledby="search-heading">
      <h2 id="search-heading" class="section-heading">
        法令を検索する
      </h2>

      <div class="search-panel">
        <form id="home-search-form">
          <label for="home-search">法令名・キーワード</label>

          <p class="search-description">
            法令名を入力してください。
          </p>

          <div class="search-row">
            <input
              id="home-search"
              class="search-input"
              type="search"
              name="q"
              placeholder="例：憲法"
              autocomplete="off"
            >

            <button class="btn btn-primary" type="submit">
              検索
            </button>
          </div>
        </form>

/* ---------------------------------------------------------
   Table of contents
--------------------------------------------------------- */

function renderToc(law) {
  if (!law.chapters.length) {
    return "";
  }

  return `
    <div class="toc">
      <ul>
        ${law.chapters.map(chapter => `
          <li>
            <a href="#chapter-${escapeHtml(chapter.num)}">
              第${escapeHtml(chapter.num)}章
              ${escapeHtml(chapter.title)}
            </a>

            <ul class="article-links">
              ${chapter.articles.map(article => `
                <li>
                  <a href="#article-${escapeHtml(chapter.num)}-${escapeHtml(article.num)}">
                    ${escapeHtml(getArticleLabel(chapter, article))}
                  </a>
                </li>
              `).join("")}
            </ul>
          </li>
        `).join("")}
      </ul>
    </div>
  `;
}

/* ---------------------------------------------------------
   Law document
--------------------------------------------------------- */

function renderContentNode(node, index, total) {
  const tag = String(node.tag || "").toLowerCase();

  if (tag === "paragraph") {
    const number = node.num
      ? `<span class="sentence-number">${escapeHtml(node.num)}</span>`
      : "";

    if (node.children.length) {
      return `
        <div class="paragraph">
          ${number}
          ${node.children.map((child, childIndex) =>
            renderContentNode(child, childIndex, node.children.length)
          ).join("")}
        </div>
      `;
    }

    return `
      <p class="sentence paragraph">
        ${number}${escapeHtml(node.text)}
      </p>
    `;
  }

  if (tag === "sentence") {
    return `
      <p class="sentence">
        ${total > 1
          ? `<span class="sentence-number">${index + 1}</span>`
          : ""}
        ${escapeHtml(node.text)}
      </p>
    `;
  }

  // 将来XMLに新しい要素が追加されても、子要素を再帰的に表示する。
  if (node.children.length) {
    return `
      <div class="xml-block">
        ${node.children.map((child, childIndex) =>
          renderContentNode(child, childIndex, node.children.length)
        ).join("")}
      </div>
    `;
  }

  return node.text
    ? `<p class="sentence">${escapeHtml(node.text)}</p>`
    : "";
}

function renderLawDocument(law) {
  return `
    <div class="law-document">

      ${law.preamble ? `
        <section class="preamble" aria-label="前文">
          ${escapeHtml(law.preamble)}
        </section>
      ` : ""}

      ${law.chapters.map(chapter => `
        <section
          class="chapter"
          id="chapter-${escapeHtml(chapter.num)}"
        >
          <h2 class="chapter-title">
            第${escapeHtml(chapter.num)}章
            ${escapeHtml(chapter.title)}
          </h2>

          ${chapter.articles.map(article => `
            <article
              class="article"
              id="article-${escapeHtml(chapter.num)}-${escapeHtml(article.num)}"
            >
              <h3 class="article-heading">
                <span class="article-number">
                  ${escapeHtml(getArticleLabel(chapter, article))}
                </span>
              </h3>

              <div class="article-content">
                ${article.nodes.map((node, index) =>
                  renderContentNode(node, index, article.nodes.length)
                ).join("")}
              </div>
            </article>
          `).join("")}
        </section>
      `).join("")}

    </div>
  `;
}

/* ---------------------------------------------------------
   Router
--------------------------------------------------------- */

function parseHash() {
  const raw = location.hash || "#/";

  if (raw === "#/" || raw === "#") {
    return {
      route: "home"
    };
  }

  if (raw === "#/laws") {
    return {
      route: "laws",
      query: ""
    };
  }

  if (raw.startsWith("#/laws?")) {
    const queryString = raw.substring("#/laws?".length);
    const params = new URLSearchParams(queryString);

    return {
      route: "laws",
      query: params.get("q") || ""
    };
  }

  if (raw === "#/about") {
    return {
      route: "about"
    };
  }

  if (raw.startsWith("#/law/")) {
    return {
      route: "law",
      id: decodeURIComponent(raw.substring("#/law/".length))
    };
  }

  return {
    route: "home"
  };
}

async function router() {
  const current = parseHash();

  window.scrollTo({
    top: 0,
    behavior: "instant"
  });

  try {
    switch (current.route) {
      case "home":
        renderHome();
        break;

      case "laws":
        renderLawSearch(current.query);
        break;

      case "about":
        renderAbout();
        break;

      case "law":
        await renderLawDetail(current.id);
        break;

      default:
        renderHome();
    }
  } catch (error) {
    showError(error.message);
  }
}

/* ---------------------------------------------------------
   Init
--------------------------------------------------------- */

async function init() {
  try {
    await loadIndex();
    await router();
  } catch (error) {
    showError(error.message);
  }
}

window.addEventListener("hashchange", router);

init();
